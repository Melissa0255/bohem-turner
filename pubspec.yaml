name: boehm_turner_analyzer
description: Aplicación para evaluar enfoques de desarrollo mediante la Estrella de Boehm-Turner.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.19.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  fl_chart: ^0.70.2
  path_provider: ^2.1.0
  screenshot: ^3.0.0
  image_gallery_saver: ^2.0.3
  permission_handler: ^11.4.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  sqflite: ^2.3.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.7
  url_launcher: ^6.1.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/